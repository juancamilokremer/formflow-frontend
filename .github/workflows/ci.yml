name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Lint, Build y Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm test

      - name: Build producción
        run: npm run build -- --configuration production

      - name: Publicar artefacto de build
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: ci

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: formflow_dev
          POSTGRES_USER: formflow
          POSTGRES_PASSWORD: formflow123
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U formflow -d formflow_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: juancamilokremer/formflow-backend
          path: backend

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Levantar el backend (perfil dev, contra los services de arriba)
        working-directory: backend
        run: |
          nohup mvn -B spring-boot:run -Dspring-boot.run.profiles=dev > /tmp/backend.log 2>&1 &
          # Generous window — a cold Maven cache (first run, or a dependency bump) can take a
          # few minutes to download before Spring Boot even starts booting.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend listo"
              exit 0
            fi
            sleep 5
          done
          echo "::error::El backend no respondió saludable a tiempo"
          cat /tmp/backend.log
          exit 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Correr tests E2E
        run: npx playwright test

      - name: Publicar reporte de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Publicar log del backend
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-log
          path: /tmp/backend.log
          retention-days: 7

  deploy:
    name: Deploy a Vercel
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    # CD solo en merge a main, nunca en PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar secrets de Vercel
        id: vercel_check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # Skip gracefully si Vercel aún no está configurado — mantiene main verde
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN no está configurado — deploy omitido (ver issue #11)"
          fi

      - name: Instalar Vercel CLI
        if: steps.vercel_check.outputs.available == 'true'
        run: npm install -g vercel@latest

      - name: Deploy a Vercel (producción)
        if: steps.vercel_check.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel --prod --token "$VERCEL_TOKEN" --yes
