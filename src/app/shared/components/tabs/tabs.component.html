<div class="tabs" role="tablist">
  @for (tab of tabs(); track tab.id) {
    <button type="button" role="tab" class="tabs__tab"
      [class.tabs__tab--active]="tab.id === activeTabId()"
      [attr.aria-selected]="tab.id === activeTabId()"
      (click)="onTabClick(tab.id)">
      {{ tab.label | translate }}
      @if (tab.badge) {
        <span class="tabs__badge tabs__badge--{{ tab.badge }}">{{ tab.badge === 'complete' ? '✓' : '⚠' }}</span>
      }
    </button>
  }
</div>
