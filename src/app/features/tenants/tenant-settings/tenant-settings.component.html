<app-page-header [title]="'settings.title' | translate" [subtitle]="'settings.subtitle' | translate" />

<app-tabs [tabs]="tabs" [activeTabId]="activeTab()" (tabChange)="setTab($event)" />

<div class="tenant-settings__content">
  @switch (activeTab()) {
    @case ('empresa') {
      <app-company-info-form />
      <app-plan-usage-card />
    }
    @case ('branding') {
      <app-branding-form />
    }
  }
</div>
