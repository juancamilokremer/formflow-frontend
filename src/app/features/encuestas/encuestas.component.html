<div class="enc">

  <app-page-header
    [title]="'encuestas.title' | translate"
    [subtitle]="'encuestas.subtitle' | translate"
  >
    <app-button (click)="navigateToNew()">
      <app-icon name="plus" [size]="16" />
      {{ 'encuestas.new_button' | translate }}
    </app-button>
  </app-page-header>

  @switch (view()) {

    @case ('loading') {
      <div class="enc__center">
        <app-loading-spinner />
      </div>
    }

    @case ('error') {
      <div class="enc__center">
        <app-empty-state
          icon="alert-circle"
          [title]="'encuestas.error.load' | translate" />
      </div>
    }

    @default {
      <div class="enc__stats">
        <app-stat-card
          [label]="'convocatorias.stats.active' | translate"
          [value]="activeCount()"
          color="success" />
        <app-stat-card
          [label]="'convocatorias.stats.draft' | translate"
          [value]="draftCount()"
          color="warning" />
        <app-stat-card
          [label]="'encuestas.stats.total_recipients' | translate"
          [value]="totalCandidates()" />
        <app-stat-card
          [label]="'convocatorias.stats.responded' | translate"
          [value]="totalResponded()"
          color="info" />
      </div>

      <app-status-filter
        [selected]="statusFilter()"
        (changed)="onFilterChanged($event)" />

      <div class="enc__list">
        @for (enc of filtered(); track enc.id) {
          <app-convocatoria-card
            [convocatoria]="enc"
            (viewDetail)="navigateToDetail($event)"
            (closeRequested)="requestClose($event)"
            (deleteRequested)="requestDelete($event)" />
        } @empty {
          <app-empty-state
            icon="inbox"
            [title]="'encuestas.empty.title' | translate"
            [subtitle]="'encuestas.empty.subtitle' | translate" />
        }
      </div>
    }

  }

</div>

<app-confirm-dialog
  [isOpen]="pendingAction() !== null"
  [title]="pendingAction()?.type === 'close' ? 'encuestas.confirm_close.title' : 'encuestas.confirm_delete.title'"
  [message]="pendingAction()?.type === 'close'
    ? ('encuestas.confirm_close.message' | translate : { name: pendingAction()?.name })
    : ('encuestas.confirm_delete.message' | translate : { name: pendingAction()?.name })"
  [confirmLabel]="pendingAction()?.type === 'close' ? 'convocatorias.card.close' : 'common.delete'"
  [loading]="actionLoading()"
  (confirmed)="confirmAction()"
  (cancelled)="cancelAction()" />
