<div class="qp__field">
  <label class="qp__label" for="qp-title">{{ 'builder.prop.title' | translate }}</label>
  <input
    id="qp-title"
    class="qp__input"
    type="text"
    [value]="question().title"
    [placeholder]="titlePlaceholder()"
    (blur)="onTitleBlur($event)"
  />
</div>

@if (showRequired()) {
  <div class="qp__field qp__field--row">
    <label class="qp__label" for="qp-required">{{ 'builder.prop.required' | translate }}</label>
    <input id="qp-required" type="checkbox" [checked]="question().required" (change)="onRequiredInput($event)" />
  </div>
}

@if (showDescription()) {
  <div class="qp__field">
    <label class="qp__label" for="qp-description">{{ 'builder.prop.description' | translate }}</label>
    <textarea
      id="qp-description"
      class="qp__textarea"
      rows="2"
      [value]="question().description ?? ''"
      (blur)="onDescriptionBlur($event)"
    ></textarea>
  </div>
}

@if (showTimeLimit()) {
  <app-time-limit-field [seconds]="question().timeLimitSeconds" (secondsChange)="timeLimitChange.emit($event)" />
}
