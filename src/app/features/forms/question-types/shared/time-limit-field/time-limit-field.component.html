<div class="qp__field">
  <label class="qp__label" for="qp-time-limit">{{ 'builder.prop.time_limit' | translate }}</label>
  <div class="qp__time-limit-group">
    <input
      id="qp-time-limit"
      class="qp__input qp__time-limit-input"
      type="number"
      min="1"
      [placeholder]="'builder.prop.time_limit_placeholder' | translate"
      [value]="displayValue"
      (blur)="onValueBlur($event)"
    />
    <select class="qp__select qp__time-limit-unit" (change)="onUnitChange($event)">
      <option value="seconds" [selected]="unit() === 'seconds'">{{ 'builder.prop.time_limit_seconds' | translate }}</option>
      <option value="minutes" [selected]="unit() === 'minutes'">{{ 'builder.prop.time_limit_minutes' | translate }}</option>
    </select>
  </div>
</div>
