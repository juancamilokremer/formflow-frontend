<div class="qp">
  <app-question-base-fields
    [question]="question()"
    (titleChange)="onTitleChange($event)"
    (requiredChange)="onRequiredChange($event)"
    (descriptionChange)="onDescriptionChange($event)"
    (timeLimitChange)="onTimeLimitChanged($event)"
  />

  <div class="qp__divider"></div>

  <fieldset class="qp__locked-group" [disabled]="locked()">
    <div class="qp__field">
      <label class="qp__label" for="qp-placeholder">{{ 'builder.prop.placeholder' | translate }}</label>
      <input
        id="qp-placeholder"
        class="qp__input"
        type="text"
        [value]="$any(question().config['placeholder']) ?? ''"
        (blur)="onPlaceholderBlur($event)"
      />
    </div>
  </fieldset>
</div>
