<div class="qp">
  <div class="qp__field">
    <label class="qp__label" for="qp-title">{{ 'builder.prop.title' | translate }}</label>
    <input id="qp-title" class="qp__input" type="text" [value]="question().title" (blur)="onTitleBlur($event)" />
  </div>

  <div class="qp__field qp__field--row">
    <label class="qp__label" for="qp-required">{{ 'builder.prop.required' | translate }}</label>
    <input id="qp-required" type="checkbox" [checked]="question().required" (change)="onRequiredChange($event)" />
  </div>

  <div class="qp__field">
    <label class="qp__label" for="qp-description">{{ 'builder.prop.description' | translate }}</label>
    <textarea
      id="qp-description"
      class="qp__textarea"
      rows="2"
      [value]="question().description ?? ''"
      (blur)="onDescriptionBlur($event)"
    ></textarea>
  </div>

  <div class="qp__field">
    <label class="qp__label" for="qp-time-limit">{{ 'builder.prop.time_limit' | translate }}</label>
    <div class="qp__time-limit-group">
      <input
        id="qp-time-limit"
        class="qp__input qp__time-limit-input"
        type="number"
        min="1"
        [placeholder]="'builder.prop.time_limit_placeholder' | translate"
        [value]="timeLimitDisplayValue"
        (blur)="onTimeLimitBlur($event)"
      />
      <select class="qp__select qp__time-limit-unit" (change)="onTimeLimitUnitChange($event)">
        <option value="seconds" [selected]="timeLimitUnit() === 'seconds'">{{ 'builder.prop.time_limit_seconds' | translate }}</option>
        <option value="minutes" [selected]="timeLimitUnit() === 'minutes'">{{ 'builder.prop.time_limit_minutes' | translate }}</option>
      </select>
    </div>
  </div>

  <div class="qp__divider"></div>

  <fieldset class="qp__locked-group" [disabled]="locked()">
    <div class="qp__field">
      <span class="qp__label">{{ 'builder.prop.matrix_rows' | translate }}</span>
      <app-option-list-editor
        [options]="currentRows()"
        [showScoring]="false"
        [disabled]="locked()"
        (optionsChanged)="onRowsChanged($event)"
      />
    </div>

    <div class="qp__divider"></div>

    <div class="qp__field">
      <span class="qp__label">{{ 'builder.prop.matrix_columns' | translate }}</span>
      <app-option-list-editor
        [options]="currentColumns()"
        [showScoring]="showScoring() && scoringType() === 'manual'"
        [disabled]="locked()"
        (optionsChanged)="onColumnsChanged($event)"
      />
    </div>

    @if (showScoring()) {
      <div class="qp__divider"></div>

      <div class="qp__field">
        <label class="qp__label" for="qp-scoring-type">{{ 'builder.prop.scoring_type' | translate }}</label>
        <select id="qp-scoring-type" class="qp__select" (change)="onScoringTypeChange($event)">
          <option value="none"   [selected]="scoringType() === 'none'">{{ 'builder.prop.scoring_none' | translate }}</option>
          <option value="manual" [selected]="scoringType() === 'manual'">{{ 'builder.prop.scoring_manual' | translate }}</option>
        </select>
      </div>
    }
  </fieldset>
</div>
