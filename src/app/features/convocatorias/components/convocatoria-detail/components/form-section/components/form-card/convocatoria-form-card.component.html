<div class="cfc">
  <div class="cfc__header">
    <span class="cfc__name">{{ formName() }}</span>
    <div class="cfc__weight-wrap">
      <input type="number" min="0" max="100" class="cfc__weight-input"
        [value]="weight()"
        [attr.aria-label]="'convocatorias.detail.form.weight_label' | translate"
        (input)="onWeightInput($any($event.target).valueAsNumber)" />
      <span class="cfc__pct">%</span>
    </div>
    <app-button type="button" variant="secondary" (click)="openForm()">
      {{ 'convocatorias.detail.form.open_action' | translate }}
    </app-button>
    <app-button type="button" variant="ghost" [iconOnly]="true" (click)="requestRemove()">
      <app-icon name="trash-2" [size]="16" />
    </app-button>
  </div>

  <app-convocatoria-weights-section
    [categories]="categories()"
    [weights]="categoryWeights()"
    [loading]="loadingCategories()"
    (weightsChanged)="onWeightsChanged($event)" />

  <div class="cfc__min-score">
    <label class="cfc__min-score-label">{{ 'convocatorias.detail.form.min_score_label' | translate }}</label>
    <input type="number" min="0" max="100" class="cfc__min-score-input"
      [value]="minScore() ?? ''"
      [placeholder]="'convocatorias.detail.form.min_score_placeholder' | translate"
      (input)="onMinScoreInput($any($event.target).value)" />
  </div>
</div>

<app-confirm-dialog
  [isOpen]="removeConfirmOpen()"
  title="convocatorias.detail.form.remove_confirm.title"
  [message]="'convocatorias.detail.form.remove_confirm.message' | translate: { name: formName() }"
  confirmLabel="convocatorias.detail.form.remove_confirm.confirm"
  [loading]="removing()"
  (confirmed)="confirmRemove()"
  (cancelled)="cancelRemove()" />
